name: Devcontainer validation
on:
  push:
    branches: [main]
    paths: ['.devcontainer/**', 'src/aspire/**', 'global.json', '.github/workflows/devcontainer-validation.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
      - name: Build and start the devcontainer on this disposable runner
        run: npx --yes @devcontainers/cli@0.89.0 up --workspace-folder . --config .devcontainer/aspire/devcontainer.json
      - name: Validate non-root Docker and the sample environment
        run: npx --yes @devcontainers/cli@0.89.0 exec --workspace-folder . --config .devcontainer/aspire/devcontainer.json bash .devcontainer/aspire/runtime-smoke.sh
